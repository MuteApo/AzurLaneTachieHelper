on:
  push:
    # branches:
    #     - "dev"
    tags:
      - "*.*.*"

  workflow_dispatch:

env:
  APP_NAME: AzurLaneTachieHelper-${{github.ref_name}}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check-out Repository
        uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build Executable
        run: ./scripts/build.ps1
    
      - name: Pack Files
        run: |
          mv .artifacts/nuitka/main.dist ${{env.APP_NAME}}
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on ${{env.APP_NAME}}.7z ${{env.APP_NAME}}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{env.APP_NAME}}.7z
          archive: false
          compression-level: 0
          retention-days: 21
